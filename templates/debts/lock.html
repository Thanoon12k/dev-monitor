{% extends "base.html" %}{% block title %}دفتر الدين{% endblock %}{% block body %}
<form class="card" method="post" style="max-width:380px;margin:30px auto;text-align:center">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div style="font-size:48px">🔒</div>
  <h2 style="margin:4px 0 14px">دفتر الدين</h2>
  {% if wait %}
  <p class="flash">محاولات غلط كثيرة. جرب بعد {{ (wait // 60) + 1 }} دقيقة.</p>
  {% elif setup %}
  <p class="mute" style="margin:0 0 8px">أول مرة: حط رمز سري من 6 أرقام</p>
  <input name="pin" type="password" inputmode="numeric" maxlength="6" placeholder="الرمز" autocomplete="new-password" required autofocus style="text-align:center;font-size:22px;letter-spacing:.3em">
  <input name="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="أعد الرمز" autocomplete="new-password" required style="text-align:center;font-size:22px;letter-spacing:.3em;margin-top:8px">
  <button style="width:100%;margin-top:12px">حفظ وفتح</button>
  {% else %}
  <input name="pin" type="password" inputmode="numeric" maxlength="6" placeholder="الرمز السري" autocomplete="current-password" required autofocus style="text-align:center;font-size:22px;letter-spacing:.3em">
  <button style="width:100%;margin-top:12px">فتح</button>
  {% endif %}
</form>
{% endblock %}
