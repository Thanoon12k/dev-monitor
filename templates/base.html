<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}apps1monitor{% endblock %}</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--text:#e8e8ea;--mute:#9aa0ab;--gold:#e6b422;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif;line-height:1.6}
a{color:var(--gold);text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stat b{display:block;font-size:1.6em;color:var(--gold)}.mute{color:var(--mute);font-size:.9em}
input,select,textarea,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b0d11;color:var(--text);width:100%}
button,.btn{background:var(--gold);color:#111;border:0;cursor:pointer;font-weight:700;width:auto;display:inline-block;padding:8px 14px;border-radius:8px}
.btn.wa{background:#25d366}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.scroll{overflow-x:auto}.flash{background:#3a1d1d;border:1px solid var(--bad);padding:8px 12px;border-radius:8px;margin-bottom:12px}
label{display:block;margin:10px 0 4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{padding:2px 8px;border-radius:99px;background:#2a2f3a;font-size:.85em}.tag.new{background:var(--gold);color:#111}
</style></head><body>
<header><a href="/"><b>🛰️ apps1monitor</b></a>{% if session.admin %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn ghost">خروج</button></form>{% endif %}</header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</main>
</body></html>
