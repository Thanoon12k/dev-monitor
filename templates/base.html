<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}apps1monitor{% endblock %}</title>
<meta name="theme-color" content="#ff6b3d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#12101a;--panel:#1f1c2b;--panel2:#282437;--line:rgba(255,255,255,.09);--text:#f3efe6;--muted:#a7a1b6;--accent:#ff6b3d;--good:#3ddc97;--bad:#ff6b81;--shadow:rgba(0,0,0,.55);--radius:18px;
--display:"Fraunces","Tajawal",Georgia,serif;--sans:"Space Grotesk","Tajawal",system-ui,sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3ede2;--panel:#fffaf1;--panel2:#f1e9da;--line:rgba(40,30,10,.12);--text:#221d14;--muted:#6d6556;--shadow:rgba(60,40,10,.28);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);line-height:1.6;overflow-x:hidden;
background:radial-gradient(1200px 600px at 15% -10%,rgba(255,107,61,.16),transparent 60%),radial-gradient(900px 500px at 110% 30%,rgba(124,58,237,.14),transparent 60%),var(--bg)}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px);margin:0;line-height:1}h1 em{font-style:italic;color:var(--accent)}
.top{max-width:1280px;margin:0 auto;padding:22px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px;color:var(--text)}
.brand-mark{font-size:40px;display:inline-block;transform:rotate(-6deg);filter:drop-shadow(0 10px 18px rgba(255,107,61,.35));transition:transform .3s cubic-bezier(.2,.8,.3,1.5)}
.brand:hover .brand-mark{transform:rotate(4deg) scale(1.06)}
.tagline{margin:6px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:center}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:0 22px 40px -22px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.stat{position:relative;overflow:hidden}.stat b{display:block;font-family:var(--display);font-size:28px}.stat span{color:var(--muted);font-size:13px}
.stat::after{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:var(--accent);opacity:.12}
.mute{color:var(--muted);font-size:.9em}
input,select,textarea{font:inherit;color:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
button,.btn{font:inherit;cursor:pointer;display:inline-block;white-space:nowrap;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;
border:1px solid transparent;color:#1a0e05;background:linear-gradient(135deg,#ff6b3d,#ff9a3c);box-shadow:3px 3px 0 #7a2a12;transition:transform .15s}
button:hover,.btn:hover{transform:translateY(-1px)}button:active,.btn:active{transform:translateY(1px)}
.btn.wa{background:linear-gradient(135deg,#16a34a,#4ade80);box-shadow:3px 3px 0 #0a3a1c;color:#04210f}
.btn.ghost{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:none}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);box-shadow:none;font-size:18px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--muted);font-size:13px;font-weight:500}
.scroll{overflow-x:auto}
.flash{background:rgba(255,107,129,.12);border:1px solid rgba(255,107,129,.35);color:var(--bad);padding:10px 14px;border-radius:12px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.tag.new{background:var(--text);color:var(--bg)}
/* goal-style boxes */
.boxes{display:grid;gap:26px 22px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding-top:12px}
.box{--c1:#ff5c39;--c2:#ff9a3c;--edge:#7a2a12;--ink:#fff;display:flex;flex-direction:column;min-height:230px;padding:22px;border-radius:var(--radius);color:var(--ink);
background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:7px 7px 0 var(--edge),0 22px 40px -12px var(--shadow);
transition:transform .25s cubic-bezier(.2,.8,.3,1.3),box-shadow .25s;animation:drop .6s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0)*60ms)}
.box:hover{transform:translateY(-6px) rotate(.6deg);box-shadow:10px 12px 0 var(--edge),0 30px 50px -14px var(--shadow)}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(3deg)}}
.box .emoji{font-size:44px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.box h3{font-size:24px;line-height:1.2;margin:auto 0 10px;text-shadow:1px 2px 0 rgba(0,0,0,.15)}
.box .lbl{background:#fffaf0;color:#2a2317;border-radius:8px;padding:8px 10px;font-size:13px;transform:rotate(.8deg);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.c-ember{--c1:#ff5c39;--c2:#ffa23c;--edge:#7a2a12}.c-sun{--c1:#f59e0b;--c2:#fde047;--edge:#8a5300;--ink:#2a1a00}
.c-ocean{--c1:#1d4ed8;--c2:#38bdf8;--edge:#0c2466}.c-violet{--c1:#6d28d9;--c2:#c084fc;--edge:#33125f}.c-teal{--c1:#0f766e;--c2:#2dd4bf;--edge:#063b37}
.hero-box{margin-bottom:22px}.hero-box h2{margin:0;font-size:clamp(22px,4vw,30px)}
</style></head><body>
<header class="top">{% block brand %}<a class="brand" href="/"><span class="brand-mark">🛰️</span><div><h1>apps<em>1monitor</em></h1><p class="tagline">كل أداة صندوق. افتحه، تابعه، وخلّصه.</p></div></a>{% endblock %}
<div class="top-actions"><button class="icon-btn" id="themeBtn" title="تبديل الثيم">◐</button>
{% block actions %}{% if session.admin %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn ghost">🔒 خروج</button></form>{% endif %}{% endblock %}</div></header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</main>
<script>document.getElementById("themeBtn").onclick=function(){var r=document.documentElement,t=r.dataset.theme==="light"?"dark":"light";r.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}}</script>
</body></html>
