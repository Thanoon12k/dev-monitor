name: viraliq content
# Writes the Golden Code page's drafts with a free AI API and hands them to the hub.
# Needs ONE repository secret: GROQ_API_KEY (console.groq.com) or GEMINI_API_KEY (aistudio.google.com).
# Without it the job exits quietly. The hub checks the workflow's OIDC token, no other secret needed.
on:
  schedule:
    - cron: "41 4 * * *"            # 07:41 Baghdad -> morning drafts (course + news)
    - cron: "41 16 * * *"           # 19:41 Baghdad -> evening draft (debate or tip)
    - cron: "7,22,37,52 * * * *"    # every 15 min -> topics the owner asked for on Telegram
  workflow_dispatch:
    inputs:
      run:
        description: "morning, evening or requests"
        default: requests
permissions:
  contents: read
  id-token: write
concurrency:
  group: viraliq-content-${{ github.event.schedule || inputs.run }}
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Write drafts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_RUN: ${{ inputs.run }}
        run: |
          case "$SCHEDULE" in
            "41 4 * * *")  RUN=morning ;;
            "41 16 * * *") RUN=evening ;;
            "")            RUN="${INPUT_RUN:-requests}" ;;
            *)             RUN=requests ;;
          esac
          python tools/viraliq/agent.py "$RUN"
